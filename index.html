<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=BBH+Hegarty&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Bowlby+One&family=Comic+Relief:wght@400;700&family=Commissioner:wght@100..900&family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik+Distressed&family=Rubik+Glitch&family=Rubik+Vinyl&display=swap"
      rel="stylesheet"

      
    />
    <!-- Odkaz na manifest -->
      <link rel="manifest" href="manifest.json">

    <!-- Podpora pro iOS (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#4CAF50">


    <title>Document</title>
  </head>
  <body>
    <!-- MAIN SCREEN -->
    <div id="p-title-container">
      <div id="title-container">
        <h1 id="make">MAKE IT</h1>
        <h1 id="make-again">MAKE SENSE</h1>
      </div>
    </div>
    <button id="play-button">PLAY</button>

    <!--WORDPACK SELECT-->
    <div id="wordpack-container" class="hidden">
      <h1 id="wordpack-title">CHOOSE A WORDPACK</h1>
      <div id="wordpack-buttons">
        <button id="wordpack-characters">Characters</button>
        <button id="wordpack-animals">Animals</button>
        <button id="wordpack-movies-series">Movies/Series</button>
        <button id="wordpack-jobs">Jobs</button>
        <button id="wordpack-videogames">Videogames</button>
      </div>
    </div>

    <!-- PLAYER COUNT SELECT -->
    <div id="player-count-container" class="hidden">
      <h1 id="player-count-title">SELECT PLAYER COUNT</h1>
        <input
          id="player-count-input"
          type="number"
          min="1"
          max="10"
          value="2"
        />
        <p id="player-count-note">*note - only 2-10 players allowed</p>
        <button id="player-count-button">CONTINUE</button>
      </div>
    </div>

    <!-- PLAYER NAMES SELECT -->
    <div id="player-names-container" class="hidden">
      <h1 id="player-names-title">ENTER PLAYER NAMES</h1>
      <div id="player-names-inputs"></div>
      <button id="start-game-button">START GAME</button>
    </div>
    <!-- GAME SCREEN -->
    <div id="game-container" class="hidden">
      <h1 id="game-title">MAKE IT MAKE SENSE!</h1>
      <h2 id="current-player">Current Player: <h3 id="current-player-name"></h3></h2>
      <div id="game-button-container">
        <button id="reveal-button">Reveal</button>
        <button id="next-player-button" class="hidden">Next Player</button>
        
      </div>
    </div>
    <!-- REVEAL SCREEN -->
    <div id="reveal-screen-container" class="hidden">
      <h1 id="reveal-title"></h1>
      <h2 id="reveal-word"></h2>
      <button id="reveal-continue-button">Continue</button>
    </div>
    
    <!-- STARTING PLAYER SCREEN -->
    <div id="starting-player-container" class="hidden">
      <h1 id="starting-player"></h1>
      <button id="play-again-button">PLAY AGAIN</button>
    </div>

  </body>

  <script src="logic.js">if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("Offline režim připraven"))
        .catch((err) => console.error("Chyba registrace SW:", err));
  });
  }</script>
</html>
